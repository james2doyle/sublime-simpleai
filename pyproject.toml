[project]
name = "SimpleAI"
version = "1.0.0"
description = ""
authors = [
    {name = "James Doyle", email = "james2doyle@gmail.com"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.8"

[tool.setuptools.packages.find]
where = ["plugin"]

[project.optional-dependencies]
dev = [
    "pyright~= 1.1", # Add pyright as a development dependency
    "ruff~=0.15", # Add ruff as a development dependency
]

# Pyright Configuration
# See https://github.com/microsoft/pyright/blob/main/docs/configuration.md
[tool.pyright]
pythonVersion = "3.8"
typeCheckingMode = "standard"
reportMissingModuleSource = "none"
reportIncompatibleMethodOverride = "none"
# Specify your source directory
include = ["./plugin"]
stubPath = "./LSP/stubs"

# Ruff Configuration
# See https://docs.astral.sh/ruff/configuration/
[tool.ruff]
preview = true
line-length = 120
target-version = 'py38'
include = ["plugin/**/*.py"]
lint.select = [
    "E", # pycodestyle errors
    "F", # pyflakes
]
